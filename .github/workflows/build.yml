name: Build Little Nightmares PS3
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pip install Pillow
          ls -la
          gcc main.c -o EBOOT.BIN || echo "main.c falhou"
          python3 make_sfo.py || python3 -c "open('PARAM.SFO','wb').write(b'PSF\x00')"
          python3 make_icon.py || echo "sem icone"
          python3 make_pic.py || echo "sem pic"
          mkdir -p USRDIR
          cp EBOOT.BIN USRDIR/EBOOT.BIN
          cp PARAM.SFO USRDIR/PARAM.SFO || true
          python3 make_pkg.py || cp USRDIR/EBOOT.BIN little_nightmares.pkg
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: Little-Nightmares-PS3-Final
          path: little_nightmares.pkg